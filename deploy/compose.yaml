name: jaehun-portfolio

services:
  web:
    # Keep the existing Compose identity: jaehun-portfolio / web.
    # Do NOT set container_name: Compose keeps jaehun-portfolio-web-1.
    image: ${PORTFOLIO_IMAGE:?PORTFOLIO_IMAGE must contain a tested commit SHA}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8780:80"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
