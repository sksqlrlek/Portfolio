server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  # 화면 파일(index.html 등)은 배포하면 바로 바뀌어야 하므로, 브라우저가 매번 바뀌었는지 확인합니다.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri $uri/ /index.html;
  }

  # Vite가 빌드할 때마다 이름에 해시를 붙이는 js·css·글꼴만 30일 동안 확인 없이 씁니다.
  # 정규식에 중괄호({8})가 있어 nginx 설정 문법과 헷갈리지 않게 따옴표로 감쌉니다.
  location ~ "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2)$" {
    expires 30d;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  # 사진·그림·PDF는 이름을 그대로 두고 내용만 바꿀 수 있으므로, 매번 바뀌었는지 확인합니다(그대로면 304).
  location /assets/ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    try_files $uri =404;
  }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
}
