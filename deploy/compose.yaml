name: jaehun-portfolio

services:
  web:
    image: ${PORTFOLIO_IMAGE:?PORTFOLIO_IMAGE must contain a tested commit SHA}
    container_name: jaehun-portfolio-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8781:80"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
